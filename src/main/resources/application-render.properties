# ============================================
# Render Production Profile
# ============================================
# Activate this profile by setting SPRING_PROFILES_ACTIVE=render
# in Render's Environment Variables

# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Render managed DB)
# Render provides individual connection properties via its blueprint
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration (set via Render environment variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (set your frontend URL in Render env vars)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://your-frontend.onrender.com}

# Logging (production-level)
logging.level.com.smartcity=INFO
logging.level.org.springframework.security=WARN
logging.level.root=INFO
